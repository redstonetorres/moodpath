<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="100%" role="img" aria-label="MoodPath 项目主视觉：记录每天的心情，遇见那月今日">
  <title>MoodPath · 那月今日</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FCF7F4"/>
      <stop offset="1" stop-color="#F4E6E0"/>
    </linearGradient>
    <linearGradient id="dot" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E8A99E"/>
      <stop offset="1" stop-color="#D77F73"/>
    </linearGradient>
    <linearGradient id="night" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F4E6E0"/>
      <stop offset="0.5" stop-color="#F4E6E0"/>
      <stop offset="0.5" stop-color="#3A322E"/>
      <stop offset="1" stop-color="#3A322E"/>
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="1200" height="480" fill="url(#bg)"/>
  <circle cx="1080" cy="120" r="190" fill="#FFFFFF" opacity="0.35"/>

  <!-- 品牌 -->
  <circle cx="150" cy="150" r="46" fill="url(#dot)"/>
  <text x="216" y="170" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="62" font-weight="700" fill="#2B2622">MoodPath</text>
  <text x="218" y="212" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="29" fill="#8A7E76">记录每天的心情，遇见那月今日。</text>

  <!-- 5 档心情标尺 -->
  <line x1="360" y1="300" x2="840" y2="300" stroke="#EAD9D2" stroke-width="4" stroke-linecap="round"/>
  <circle cx="360" cy="300" r="26" fill="#7BA7C7"/>
  <circle cx="480" cy="300" r="26" fill="#9CC2C9"/>
  <circle cx="600" cy="300" r="26" fill="#E6C8A0"/>
  <circle cx="720" cy="300" r="26" fill="#E59E92"/>
  <circle cx="840" cy="300" r="26" fill="#D17A6E"/>
  <text x="360" y="356" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="22" fill="#9C9088">低落</text>
  <text x="480" y="356" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="22" fill="#9C9088">平静</text>
  <text x="600" y="356" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="22" fill="#9C9088">尚可</text>
  <text x="720" y="356" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="22" fill="#9C9088">不错</text>
  <text x="840" y="356" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="22" fill="#9C9088">很好</text>

  <!-- 那月今日 / 那年今日 胶囊 -->
  <rect x="360" y="388" width="480" height="58" rx="29" fill="#FFFFFF" stroke="#EAD9D2" stroke-width="2"/>
  <text x="600" y="425" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="28" font-weight="600" fill="#8A5A50">那月今日 · 那年今日</text>

  <!-- 日夜切换母题 -->
  <circle cx="1040" cy="150" r="40" fill="url(#night)"/>
  <circle cx="1058" cy="138" r="30" fill="#F4E6E0"/>
</svg>
